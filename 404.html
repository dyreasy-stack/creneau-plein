<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable — Créneau Plein</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sapin:#0F3D2E;--orange:#E8590C;--creme:#FAF7F2}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--sapin);color:var(--creme);font:400 1.0625rem/1.55 "Public Sans",system-ui,sans-serif;display:flex;align-items:center;padding:1.25rem calc(1.25rem + env(safe-area-inset-right,0px)) calc(1.25rem + env(safe-area-inset-bottom,0px)) calc(1.25rem + env(safe-area-inset-left,0px))}
main{max-width:30rem;margin:0 auto;width:100%}
.marque{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;margin-bottom:2rem}
.code{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;font-size:5rem;line-height:1;color:var(--orange)}
h1{font-family:"Bricolage Grotesque",Georgia,serif;font-weight:800;font-size:2.2rem;line-height:1.05;letter-spacing:-.02em;margin:.5rem 0 1rem}
p{color:#D5E2DB;margin-bottom:2rem}
a{display:block;text-align:center;background:var(--orange);color:#fff;font-weight:600;font-size:1.1rem;text-decoration:none;padding:1.05rem 1rem;border-radius:6px;min-height:52px}
a:focus-visible{outline:3px solid var(--creme);outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="marque">Créneau Plein</div>
<div class="code">404</div>
<h1>Ce créneau n'existe pas.</h1>
<p>La page demandée a été déplacée ou n'a jamais existé. Revenez à l'accueil.</p>
<a href="/">Retour à l'accueil</a>
</main>
</body>
</html>
